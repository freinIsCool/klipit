[package]
name = "klipit"
version = "0.0.0-indev"
edition = "2024"
license = "MIT"

[[bin]]
name = "klipit"
path = "src/main.rs"

[lints.rust]
unused = "allow"


[dependencies]
ashpd = { version = "0.13.13", features = ["screencast", "pipewire"] }
ez-ffmpeg = "0.19.3"
libspa = "0.9.2"
pipewire = "0.9.2"
tokio = "1.53.2"
